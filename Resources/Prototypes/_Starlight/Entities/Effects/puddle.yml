# Funky footprints
- type: entity
  parent: SolutionPrint
  name: footprint
  id: Footprint
  save: false
  description: Huh? Whose footprints are these?
  placement:
    mode: SnapgridCenter
  components:
  - type: Appearance
  - type: Clickable
  - type: Transform
    noRot: false
    anchored: true
  - type: Sprite
    drawdepth: FloorObjects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      slipFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - ItemMask
        layer:
        - SlipLayer
        hard: false
  - type: Footprint
  - type: Puddle
    solution: print
    affectsMovement: false
    affectsSound: false
    causesStains: false
  - type: ExaminableSolution
    solution: print
  - type: MixableSolution
    solution: print
  - type: DrawableSolution
    solution: print
  - type: BadDrink
  - type: IgnoresFingerprints
  - type: Tag
    tags:
    - DNASolutionScannable
    - HideContextMenu

# For entities with PawPrintsComponent - same as Footprint but uses the paw sprite for
# the standing state. Dragging still uses the default Footprint entity above.
- type: entity
  parent: Footprint
  name: paw prints
  id: PawFootprint
  save: false
  description: Huh? Whose paw prints are these?
  components:
  - type: Footprint
    sprites: /Textures/_Starlight/Effects/pawprints.rsi
